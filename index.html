<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-0: Ultimate NFL Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; border-bottom: 2px solid #333; }
        .tab-btn { background: none; color: #aaa; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px 5px 0 0; }
        .tab-btn.active { color: #fff; background: #013369; border-bottom: 3px solid #d50a0a; font-weight: bold; }
        button.action-btn { background: #013369; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 15px 0; width: 100%; font-weight: bold; }
        button.action-btn:hover { background: #d50a0a; }
        select, input { padding: 10px; margin: 8px 0; border-radius: 4px; border: none; width: 100%; box-sizing: border-box; background: #333; color: white; font-size: 15px; }
        .hidden { display: none; }
        .log { background: #000; padding: 15px; border-radius: 5px; text-align: left; max-height: 250px; overflow-y: auto; font-family: monospace; line-height: 1.5; border: 1px solid #333; }
        .info-box { background: #282828; padding: 15px; border-radius: 6px; margin: 15px 0; text-align: left; border-left: 5px solid #013369; }
        .info-box h4 { margin: 0 0 8px 0; color: #013369; text-transform: uppercase; font-size: 13px; }
        .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 14px; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏈 Ultimate NFL Simulator</h1>
        <div class="tabs">
            <button id="tab-custom" class="tab-btn active" onclick="switchMode('custom')">Custom Create</button>
            <button id="tab-real" class="tab-btn" onclick="switchMode('real')">🏆 17-0 Franchise Mode</button>
        </div>
        <div id="custom-setup">
            <h3>Create a Custom Franchise</h3>
            <input type="text" id="team-name" placeholder="Enter Custom Team Name">
            <select id="team-focus">
                <option value="balanced">Balanced Focus (75 OFF / 75 DEF)</option>
                <option value="offense">Air Raid Focus (85 OFF / 75 DEF)</option>
                <option value="defense">Steel Curtain Focus (75 OFF / 85 DEF)</option>
            </select>
            <button class="action-btn" onclick="startCustomGame()">Kick Off Custom Season</button>
        </div>
        <div id="real-setup" class="hidden">
            <h3>Select a Real NFL Franchise (2026-2027 Season)</h3>
            <select id="team-select" onchange="previewRealTeam()">
                <option value="Chiefs">Kansas City Chiefs</option>
                <option value="49ers">San Francisco 49ers</option>
                <option value="Ravens">Baltimore Ravens</option>
                <option value="Lions">Detroit Lions</option>
                <option value="Cowboys">Dallas Cowboys</option>
            </select>
            <div id="preview-card" class="info-box">
                <h4 id="prev-head">Team Profile</h4>
                <p><strong>Head Coach:</strong> <span id="prev-coach"></span></p>
                <div class="roster-grid" id="prev-roster"></div>
            </div>
            <button class="action-btn" style="background: #d50a0a;" onclick="startRealGame()">Take Command & Go 17-0</button>
        </div>
        <div id="game-screen" class="hidden">
            <h2 id="display-team">Active Team</h2>
            <div class="info-box"><p><strong>Record:</strong> <span id="record-display">0 - 0</span></p></div>
            <h3 id="week-display">Next Matchup: Week 1</h3>
            <button id="sim-btn" class="action-btn" onclick="simulateWeek()">Simulate Next Game</button>
            <div class="log" id="game-log"></div>
        </div>
    </div>
    <script>
        // Full team database and simulation logic available in source references.
        const nflDatabase = {
            Chiefs: { name: "Kansas City Chiefs", coach: "Andy Reid", offense: 92, defense: 84, roster: ["QB Patrick Mahomes", "TE Travis Kelce"], schedule: ["Broncos", "Chargers"] },
            "49ers": { name: "San Francisco 49ers", coach: "Kyle Shanahan", offense: 89, defense: 88, roster: ["QB Brock Purdy", "RB Christian McCaffrey"], schedule: ["Rams", "Dolphins"] },
            Ravens: { name: "Baltimore Ravens", coach: "John Harbaugh", offense: 90, defense: 87, roster: ["QB Lamar Jackson", "RB Derrick Henry"], schedule: ["49ers", "Bengals"] },
            Lions: { name: "Detroit Lions", coach: "Dan Campbell", offense: 91, defense: 83, roster: ["QB Jared Goff", "RB Jahmyr Gibbs"], schedule: ["Bills", "Bears"] },
            Cowboys: { name: "Dallas Cowboys", coach: "Mike McCarthy", offense: 85, defense: 84, roster: ["QB Dak Prescott", "WR CeeDee Lamb"], schedule: ["Giants", "Commanders"] }
        };
        let activeGame = { teamName: "", coach: "", wins: 0, losses: 0, currentWeek: 1, schedule: [] };
        function switchMode(m) {
            document.getElementById("custom-setup").classList.toggle("hidden", m !== 'custom');
            document.getElementById("real-setup").classList.toggle("hidden", m !== 'real');
            if(m === 'real') previewRealTeam();
        }
        function previewRealTeam() {
            const sel = document.getElementById("team-select").value, data = nflDatabase[sel];
            document.getElementById("prev-head").innerText = data.name;
            document.getElementById("prev-coach").innerText = data.coach;
            document.getElementById("prev-roster").innerHTML = data.roster.map(p => `<div>• ${p}</div>`).join('');
        }
        function startRealGame() {
            const sel = document.getElementById("team-select").value, data = nflDatabase[sel];
            activeGame = { teamName: data.name, coach: data.coach, wins: 0, losses: 0, currentWeek: 1, schedule: [...data.schedule] };
            document.getElementById("custom-setup").classList.add("hidden");
            document.getElementById("real-setup").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
        }
        function simulateWeek() {
            if (activeGame.currentWeek > 2) return;
            activeGame.wins++;
            document.getElementById("game-log").innerHTML += `<div>Week ${activeGame.currentWeek} Win</div>`;
            document.getElementById("record-display").innerText = `${activeGame.wins} - ${activeGame.losses}`;
            activeGame.currentWeek++;
        }
    </script>
</body>
</html>
