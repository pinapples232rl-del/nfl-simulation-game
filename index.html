<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>17-0 & Ring Run: Ultimate NFL Simulator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b0f19; color: #fff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 30px auto; background: #141d2f; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #222f47; }
        .tabs { display: flex; justify-content: center; margin-bottom: 25px; gap: 10px; }
        .tab-btn { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 12px 24px; font-size: 15px; cursor: pointer; border-radius: 6px; font-weight: bold; transition: all 0.2s ease; }
        .tab-btn.active { color: #fff; background: #013369; border-color: #d50a0a; box-shadow: 0 0 10px rgba(1, 51, 105, 0.5); }
        button.action-btn { background: #013369; color: white; border: none; padding: 14px 28px; font-size: 16px; border-radius: 6px; cursor: pointer; margin: 15px 0; width: 100%; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: background 0.2s; }
        button.action-btn:hover { background: #d50a0a; }
        select { padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; width: 100%; background: #1e293b; color: white; font-size: 16px; }
        .hidden { display: none; }
        .log { background: #020617; padding: 20px; border-radius: 8px; text-align: left; max-height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; line-height: 1.6; border: 1px solid #1e293b; }
        .info-box { background: #1e293b; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: left; border-left: 6px solid #013369; }
        .info-box h4 { margin: 0 0 12px 0; color: #38bdf8; text-transform: uppercase; font-size: 14px; letter-spacing: 0.5px; }
        .roster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; color: #cbd5e1; }
        .stat-badge { background: #0f172a; padding: 4px 8px; border-radius: 4px; font-weight: bold; color: #fbbf24; font-size: 12px; float: right; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏈 NFL Gridiron Simulator</h1>
        
        <div class="tabs">
            <button id="tab-classic" class="tab-btn active" onclick="switchMode('classic')">Standard 17-0 Run</button>
            <button id="tab-ring" class="tab-btn" onclick="switchMode('ring')">🏆 Ring Run Mode</button>
        </div>

        <!-- SELECTION SCREEN -->
        <div id="setup-screen">
            <h3>Choose Your Franchise (Madden Ratings Engine)</h3>
            <select id="team-select" onchange="updateTeamPreview()">
                <!-- Automatically populated by JS -->
            </select>
            
            <div id="preview-card" class="info-box">
                <h2 id="prev-name" style="margin: 0 0 10px 0; color: #fff;">Team</h2>
                <p><strong>Madden Team OVR:</strong> <span id="prev-ovr"></span> (OFF: <span id="prev-off"></span> | DEF: <span id="prev-def"></span>)</p>
                <h4>Core Star Roster Overalls</h4>
                <div class="roster-grid" id="prev-roster"></div>
            </div>
            <button class="action-btn" onclick="launchFranchise()">Take Command</button>
        </div>

        <!-- SIMULATION ACTIVE DASHBOARD -->
        <div id="game-screen" class="hidden">
            <h2 id="display-team">Active Team</h2>
            <div class="info-box" style="display: flex; justify-content: space-around; text-align: center;">
                <div><h5>MODE</h5><p id="display-mode" style="font-weight:bold; color:#fbbf24; margin:5px 0;">17-0</p></div>
                <div><h5>RECORD</h5><p id="record-display" style="font-weight:bold; font-size: 1.4em; margin:5px 0;">0 - 0</p></div>
                <div><h5>TEAM RATING</h5><p id="display-rating" style="font-weight:bold; margin:5px 0;">80</p></div>
            </div>
            <h3 id="week-display">Next Matchup: Week 1</h3>
            <button id="sim-btn" class="action-btn" onclick="processSimStep()">Simulate Next Game</button>
            <div class="log" id="game-log"></div>
        </div>
    </div>

const schedulePool = ["Chiefs", "Niners", "Ravens", "Dolphins", "Lions", "Cowboys", "Browns", "Bengals", "Eagles", "Texans", "Jets", "Bills", "Steelers", "Falcons", "Buccaneers", "Packers", "Bears", "Raiders", "Chargers", "Colts", "Jaguars", "Rams", "Vikings", "Saints", "Titans", "Seahawks", "Patriots", "Broncos", "Panthers", "Commanders", "Cardinals", "Giants"];
let gameMode = "classic";
let activeTeamKey = "Chiefs";
let session = { wins: 0, losses: 0, currentWeek: 1, schedule: [], playoffRound: 0 };
window.onload = function() {
const selectMenu = document.getElementById("team-select");
for (let key in nfl32Database) {
let opt = document.createElement("option");
opt.value = key;
opt.innerText = nfl32Database[key].name;
selectMenu.appendChild(opt);
}
updateTeamPreview();
};
function switchMode(mode) {
gameMode = mode;
document.getElementById("tab-classic").classList.toggle("active", mode === 'classic');
document.getElementById("tab-ring").classList.toggle("active", mode === 'ring');
document.getElementById("display-mode").innerText = mode === 'classic' ? "17-0 RUN" : "RING RUN";
}
function updateTeamPreview() {
activeTeamKey = document.getElementById("team-select").value;
const data = nfl32Database[activeTeamKey];
document.getElementById("prev-name").innerText = data.name;
document.getElementById("prev-ovr").innerText = data.ovr;
document.getElementById("prev-off").innerText = data.off;
document.getElementById("prev-def").innerText = data.def;
let rosterHtml = "";
for (let player in data.roster) {
rosterHtml += <div>• ${player} <span class="stat-badge">${data.roster[player]} OVR</span></div>;
}
document.getElementById("prev-roster").innerHTML = rosterHtml;
}
function generateUniqueSchedule(userKey) {
let list = schedulePool.filter(team => team !== userKey);
return list.sort(() => 0.5 - Math.random()).slice(0, 17);
}
function launchFranchise() {
const data = nfl32Database[activeTeamKey];
session.wins = 0;
session.losses = 0;
session.currentWeek = 1;
session.playoffRound = 0;
session.schedule = generateUniqueSchedule(activeTeamKey);
document.getElementById("display-team").innerText = data.name;
document.getElementById("display-rating").innerText = data.ovr;
document.getElementById("record-display").innerText = "0 - 0";
document.getElementById("game-log").innerHTML = <div>🚀 Franchise loaded! Objective: ${gameMode === 'classic' ? 'Go undefeated 17-0' : 'Win the Super Bowl'}</div>;
updateNextMatchupDisplay();
document.getElementById("setup-screen").classList.add("hidden");
document.getElementById("game-screen").classList.remove("hidden");
document.getElementById("sim-btn").innerText = "Simulate Next Game";
document.getElementById("sim-btn").setAttribute("onclick", "processSimStep()");
}
function updateNextMatchupDisplay() {
if (session.currentWeek <= 17) {
let opp = nfl32Database[session.schedule[session.currentWeek - 1]].name;
document.getElementById("week-display").innerText = Week ${session.currentWeek} vs ${opp};
} else if (gameMode === "ring") {
const rounds = ["Wildcard Round", "Divisional Round", "Conference Championship", "💸 SUPER BOWL 💸"];
document.getElementById("week-display").innerText = rounds[session.playoffRound];
}
}
function processSimStep() {
if (session.currentWeek <= 17) {
simulateRegularSeasonGame();
} else if (gameMode === "ring" && session.playoffRound < 4) {
simulatePlayoffGame();
}
}
function simulateRegularSeasonGame() {
let oppKey = session.schedule[session.currentWeek - 1];
let oppData = nfl32Database[oppKey];
let userData = nfl32Database[activeTeamKey];
let winChance = 0.5 + ((userData.ovr - oppData.ovr) * 0.02);
let userWon = Math.random() < winChance;
let userScore = Math.floor(Math.random() * 17) + Math.floor(userData.off / 4);
let oppScore = Math.floor(Math.random() * 17) + Math.floor(oppData.off / 4);
if (userWon && userScore <= oppScore) userScore = oppScore + Math.floor(Math.random() * 7) + 1;
if (!userWon && oppScore <= userScore) oppScore = userScore + Math.floor(Math.random() * 7) + 1;
const log = document.getElementById("game-log");
if (userWon) {
session.wins++;
log.innerHTML = <div style="color:#4ade80">🟢 Week ${session.currentWeek}: W ${userScore}-${oppScore} vs ${oppData.name}</div> + log.innerHTML;
} else {
session.losses++;
log.innerHTML = <div style="color:#f87171">🔴 Week ${session.currentWeek}: L ${userScore}-${oppScore} vs ${oppData.name}</div> + log.innerHTML;
}
document.getElementById("record-display").innerText = ${session.wins} - ${session.losses};
session.currentWeek++;
if (session.currentWeek > 17) {
handleRegularSeasonEnd();
} else {
updateNextMatchupDisplay();
}
}
function handleRegularSeasonEnd() {
const log = document.getElementById("game-log");
if (gameMode === "classic") {
if (session.wins === 17) {
log.innerHTML = <div style="color: #fbbf24; font-weight: bold; font-size: 1.2em;">🏆 GOLDEN GOAL ACHIEVED! Perfect 17-0!</div> + log.innerHTML;
} else {
log.innerHTML = <div style="color: #ef4444;">Challenged missed! Final record: ${session.wins}-${session.losses}.</div> + log.innerHTML;
}
triggerResetState();
} else {
if (session.wins >= 9) {
log.innerHTML = <div style="color: #38bdf8; font-weight: bold;">🔥 Finished ${session.wins}-${session.losses}. You Clinched the Playoffs! Entering Tournament...</div> + log.innerHTML;
updateNextMatchupDisplay();
} else {
log.innerHTML = <div style="color: #ef4444;">Missed the playoffs (${session.wins}-${session.losses}). Ring Run Over.</div> + log.innerHTML;
triggerResetState();
}
}
}
function simulatePlayoffGame() {
let eliteOpponents = ["Chiefs", "Niners", "Ravens", "Dolphins", "Lions", "Cowboys"].filter(k => k !== activeTeamKey);
let oppKey = eliteOpponents[Math.floor(Math.random() * eliteOpponents.length)];
let oppData = nfl32Database[oppKey];
let userData = nfl32Database[activeTeamKey];
let winChance = 0.48 + ((userData.ovr - oppData.ovr) * 0.02);
let userWon = Math.random() < winChance;
let userScore = Math.floor(Math.random() * 14) + Math.floor(userData.off / 4) + 3;
let oppScore = Math.floor(Math.random() * 14) + Math.floor(oppData.off / 4) + 3;
if (userWon && userScore <= oppScore) userScore = oppScore + 3;
if (!userWon && oppScore <= userScore) oppScore = userScore + 3;
const log = document.getElementById("game-log");
const roundNames = ["Wildcard", "Divisional", "Conference Championship", "Super Bowl"];
let currentRoundName = roundNames[session.playoffRound];
if (userWon) {
log.innerHTML = <div style="color:#a78bfa; font-weight:bold;">🏆 ${currentRoundName} Victory: W ${userScore}-${oppScore} vs ${oppData.name}</div> + log.innerHTML;
session.playoffRound++;
if (session.playoffRound === 4) {
log.innerHTML = <div style="color: #fbbf24; font-weight: bold; font-size: 1.4em; padding:10px 0;">👑 WORLD CHAMPIONS! You won the Super Bowl! 👑</div> + log.innerHTML;
triggerResetState();
} else {
updateNextMatchupDisplay();
}
} else {
log.innerHTML = <div style="color:#ef4444; font-weight:bold;">❌ Knocked out in the ${currentRoundName}: L ${userScore}-${oppScore} vs ${oppData.name}</div> + log.innerHTML;
triggerResetState();
}
}
function triggerResetState() {
document.getElementById("week-display").innerText = "Tournament/Season Over";
document.getElementById("sim-btn").innerText = "Main Menu / Restart";
document.getElementById("sim-btn").setAttribute("onclick", "location.reload()");
}
